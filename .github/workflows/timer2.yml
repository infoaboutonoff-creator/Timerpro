                  val t = readSeconds()
                  prefs.edit().putInt(Prefs.TOTAL_SECS, t).apply()
                  showSeconds(t)
                  stopPreview()
                  startForegroundService(
                      Intent(this, TimerService::class.java)
                          .putExtra(TimerService.EXTRA_SECONDS, t)
                          .putExtra(TimerService.EXTRA_AUTOSTART, false)
                  )
