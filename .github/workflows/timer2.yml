              // ---------- actions ----------

              private fun updatePermission() {
                  val ok = Settings.canDrawOverlays(this)
                  permStatus.text = if (ok) "Ready. Overlay permission is granted."
                  else "One-time setup: allow \"Display over other apps\" so the bubble can float."
                  permStatus.setTextColor(
                      if (ok) (if (night) 0xFF69F0AE.toInt() else 0xFF1B8E4B.toInt())
                      else (if (night) 0xFFFFB74D.toInt() else 0xFFB36B00.toInt())
                  )
                  permBtn.visibility = if (ok) View.GONE else View.VISIBLE
