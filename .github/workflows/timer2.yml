              @Suppress("DEPRECATION")
              private fun pickFromPhone() {
                  val i = Intent(RingtoneManager.ACTION_RINGTONE_PICKER).apply {
                      putExtra(RingtoneManager.EXTRA_RINGTONE_TYPE, RingtoneManager.TYPE_ALARM or RingtoneManager.TYPE_RINGTONE)
                      putExtra(RingtoneManager.EXTRA_RINGTONE_TITLE, "Choose alarm sound")
                      putExtra(RingtoneManager.EXTRA_RINGTONE_SHOW_SILENT, false)
                      putExtra(RingtoneManager.EXTRA_RINGTONE_SHOW_DEFAULT, true)
                      prefs.getString(Prefs.SOUND_URI, null)?.let {
                          putExtra(RingtoneManager.EXTRA_RINGTONE_EXISTING_URI, Uri.parse(it))
                      }
                  }
                  startActivityForResult(i, RING_PICK)
              }

              @Suppress("DEPRECATION")
              override fun onActivityResult(requestCode: Int, resultCode: Int, data: Intent?) {
                  super.onActivityResult(requestCode, resultCode, data)
                  if (requestCode == RING_PICK && resultCode == RESULT_OK) {
                      val uri: Uri? = data?.getParcelableExtra(RingtoneManager.EXTRA_RINGTONE_PICKED_URI)
                      if (uri != null) {
                          prefs.edit().putString(Prefs.SOUND_URI, uri.toString())
                              .putString(Prefs.SOUND_ID, "custom").apply()
                          updateCustomName()
                          updateSoundMarks()
                      }
                  }
              }

              private fun updateCustomName() {
                  val s = prefs.getString(Prefs.SOUND_URI, null)
                  customName.text = if (s.isNullOrEmpty()) "Pick any sound from your phone"
                  else try {
                      RingtoneManager.getRingtone(this, Uri.parse(s))?.getTitle(this) ?: "Custom sound"
                  } catch (e: Exception) {
                      "Custom sound"
                  }
              }

              private fun updateSoundMarks() {
                  val sel = prefs.getString(Prefs.SOUND_ID, "bell")
                  soundMarks.forEach { (id, tv) ->
                      tv.text = if (id == sel) "●" else "○"
                      tv.setTextColor(if (id == sel) ACCENT else TEXT_DIM)
                  }
              }

              // ---------- UI helpers ----------

              private fun rounded(color: Int, r: Int) = GradientDrawable().apply {
                  setColor(color)
                  cornerRadius = dp(r).toFloat()
              }

              private fun label(text: String, sp: Float = 14f, color: Int = TEXT_MAIN, bold: Boolean = false) =
                  TextView(this).apply {
                      this.text = text
                      textSize = sp
                      setTextColor(color)
                      if (bold) typeface = Typeface.DEFAULT_BOLD
                  }

              private fun card(title: String, subtitle: String? = null): LinearLayout {
                  val c = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      background = rounded(BG_CARD, 18)
                      setPadding(dp(16), dp(14), dp(16), dp(16))
                  }
                  c.addView(label(title, 17f, TEXT_MAIN, true))
                  if (subtitle != null) {
                      c.addView(label(subtitle, 12.5f, TEXT_DIM).apply { setPadding(0, dp(2), 0, 0) })
                  }
                  return c
              }

              private fun addGap(parent: LinearLayout, h: Int) {
                  parent.addView(View(this), LinearLayout.LayoutParams(1, dp(h)))
              }

              private fun pill(text: String, fill: Int, onClick: () -> Unit) = Button(this).apply {
                  this.text = text
                  isAllCaps = false
                  textSize = 15f
                  setTextColor(Color.WHITE)
                  typeface = Typeface.DEFAULT_BOLD
                  background = rounded(fill, 14)
                  stateListAnimator = null
                  setOnClickListener { onClick() }
              }

              private fun smallBtn(text: String, onClick: () -> Unit) = Button(this).apply {
                  this.text = text
                  isAllCaps = false
                  textSize = 13f
                  minWidth = 0
                  minimumWidth = 0
                  minHeight = 0
                  minimumHeight = 0
                  setPadding(dp(14), dp(8), dp(14), dp(8))
                  setTextColor(TEXT_MAIN)
                  background = rounded(BG_BTN, 10)
                  stateListAnimator = null
                  setOnClickListener { onClick() }
              }

              private fun mkSwitch(text: String, key: String, def: Boolean, after: () -> Unit = {}) =
                  Switch(this).apply {
                      this.text = text
                      textSize = 15f
                      setTextColor(TEXT_MAIN)
                      isChecked = prefs.getBoolean(key, def)
                      val states = arrayOf(intArrayOf(android.R.attr.state_checked), intArrayOf())
                      thumbTintList = ColorStateList(
                          states, intArrayOf(ACCENT, if (night) 0xFF8A94A8.toInt() else 0xFFB0B8C8.toInt())
                      )
                      trackTintList = ColorStateList(
                          states, intArrayOf(0x884F8CFF.toInt(), if (night) 0x44FFFFFF else 0x33000000)
                      )
                      setOnCheckedChangeListener { _, on ->
                          prefs.edit().putBoolean(key, on).apply()
                          after()
                      }
                  }

              private fun tint(s: SeekBar, color: Int) {
                  s.progressTintList = ColorStateList.valueOf(color)
                  s.thumbTintList = ColorStateList.valueOf(color)
              }

              /** A labelled slider that saves to prefs under [key]. */
              private fun sliderRow(
                  parent: LinearLayout, title: String, lo: Int, hi: Int, key: String, def: Int,
                  show: (Int) -> String
              ) {
                  val head = label("$title: ${show(prefs.getInt(key, def))}", 13.5f, TEXT_DIM)
                  head.setPadding(0, dp(12), 0, 0)
                  val sb = SeekBar(this).apply {
                      max = hi - lo
                      progress = prefs.getInt(key, def).coerceIn(lo, hi) - lo
                      tint(this, ACCENT)
                      setOnSeekBarChangeListener(object : SeekBar.OnSeekBarChangeListener {
                          override fun onProgressChanged(s: SeekBar?, p: Int, fromUser: Boolean) {
                              head.text = "$title: ${show(p + lo)}"
                              if (fromUser) {
                                  prefs.edit().putInt(key, p + lo).apply()
                                  refreshAll()
                              }
                          }

                          override fun onStartTrackingTouch(s: SeekBar?) {}
                          override fun onStopTrackingTouch(s: SeekBar?) {}
                      })
                  }
                  parent.addView(head)
                  parent.addView(sb)
              }

              private fun colorCard(title: String, subtitle: String, key: String, def: Int): LinearLayout {
                  val c = card(title, subtitle)
                  val start = prefs.getInt(key, def)
                  val bars = arrayOfNulls<SeekBar>(3)
                  var busy = false

                  fun applyColor(color: Int, fromPalette: Boolean) {
                      if (fromPalette) {
                          busy = true
                          bars[0]?.progress = Color.red(color)
                          bars[1]?.progress = Color.green(color)
                          bars[2]?.progress = Color.blue(color)
                          busy = false
                      }
                      prefs.edit().putInt(key, color or 0xFF000000.toInt()).apply()
                      refreshAll()
                  }

                  addGap(c, 10)
                  Prefs.PALETTE.toList().chunked(6).forEach { chunk ->
                      val row = LinearLayout(this).apply { orientation = LinearLayout.HORIZONTAL }
                      chunk.forEach { col ->
                          val dot = View(this).apply {
                              background = GradientDrawable().apply {
                                  shape = GradientDrawable.OVAL
                                  setColor(col)
                                  setStroke(dp(2), if (night) 0x55FFFFFF else 0x33000000)
                              }
                              setOnClickListener { applyColor(col, true) }
                          }
                          row.addView(
                              dot,
                              LinearLayout.LayoutParams(0, dp(40), 1f).apply { setMargins(dp(4), dp(4), dp(4), dp(4)) }
                          )
                      }
                      c.addView(row)
                  }

                  val names = arrayOf("Red", "Green", "Blue")
                  val tints = intArrayOf(0xFFFF5252.toInt(), 0xFF2EB872.toInt(), 0xFF448AFF.toInt())
                  val values = intArrayOf(Color.red(start), Color.green(start), Color.blue(start))
                  for (i in 0..2) {
                      val head = label(names[i], 12.5f, TEXT_DIM).apply { setPadding(0, dp(8), 0, 0) }
                      val sb = SeekBar(this).apply {
                          max = 255
                          progress = values[i]
                          tint(this, tints[i])
                          setOnSeekBarChangeListener(object : SeekBar.OnSeekBarChangeListener {
                              override fun onProgressChanged(s: SeekBar?, p: Int, fromUser: Boolean) {
                                  if (busy || !fromUser) return
                                  applyColor(
                                      Color.rgb(bars[0]!!.progress, bars[1]!!.progress, bars[2]!!.progress),
                                      false
                                  )
                              }

                              override fun onStartTrackingTouch(s: SeekBar?) {}
                              override fun onStopTrackingTouch(s: SeekBar?) {}
                          })
                      }
                      bars[i] = sb
                      c.addView(head)
                      c.addView(sb)
                  }
                  return c
              }

              private fun soundRow(parent: LinearLayout, id: String, name: String, sub: String? = null) {
                  val mark = label("○", 18f, TEXT_DIM)
                  soundMarks[id] = mark
                  val nameBox = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL }
                  nameBox.addView(label(name, 15f))
                  if (id == "custom") {
                      customName = label("", 12f, TEXT_DIM)
                      nameBox.addView(customName)
                  } else if (sub != null) {
                      nameBox.addView(label(sub, 12f, TEXT_DIM))
                  }
                  val row = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER_VERTICAL
                      setPadding(dp(4), dp(8), dp(4), dp(8))
                      setOnClickListener {
                          if (id == "custom" && prefs.getString(Prefs.SOUND_URI, null).isNullOrEmpty()) {
                              pickFromPhone()
                          } else {
                              prefs.edit().putString(Prefs.SOUND_ID, id).apply()
                              updateSoundMarks()
                          }
                      }
                  }
                  row.addView(mark, LinearLayout.LayoutParams(dp(30), LinearLayout.LayoutParams.WRAP_CONTENT))
                  row.addView(nameBox, LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f))
                  if (id == "custom") {
                      row.addView(smallBtn("Browse") { pickFromPhone() })
                      row.addView(View(this), LinearLayout.LayoutParams(dp(6), 1))
                  }
                  row.addView(smallBtn("▶ Play") { togglePreview(id) })
                  parent.addView(row)
              }

              private fun timeField(initial: Int): EditText = EditText(this).apply {
                  inputType = InputType.TYPE_CLASS_NUMBER
                  filters = arrayOf(InputFilter.LengthFilter(2))
                  setText(String.format(Locale.US, "%02d", initial))
                  gravity = Gravity.CENTER
                  textSize = 26f
                  typeface = Typeface.create(Typeface.MONOSPACE, Typeface.BOLD)
                  setTextColor(TEXT_MAIN)
                  background = rounded(BG_INPUT, 12)
                  setPadding(dp(8), dp(10), dp(8), dp(10))
                  setSelectAllOnFocus(true)
              }

              // ---------- screen ----------

              private fun buildUi(): View {
                  // Live preview bar: fixed at the bottom, always visible while you edit
                  pv = BubbleViews(this)
                  pv.applyStyle(prefs)
                  updatePreviewText()
                  pv.holder.setOnTouchListener { _, e ->
                      when (e.action) {
                          MotionEvent.ACTION_DOWN -> {
                              pv.showHalo(true, prefs)
                              touchBuzz(this, prefs)
                          }
                          MotionEvent.ACTION_UP, MotionEvent.ACTION_CANCEL -> pv.showHalo(false, prefs)
                      }
                      true
                  }

                  val stage = LinearLayout(this).apply {
                      gravity = Gravity.CENTER
                      background = rounded(BG_STAGE, 12)
                      setPadding(dp(8), dp(2), dp(8), dp(2))
                  }
                  stage.addView(pv.holder)

                  val bar = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      elevation = dp(10).toFloat()
                      val r = dp(20).toFloat()
                      background = GradientDrawable().apply {
                          setColor(BG_CARD)
                          cornerRadii = floatArrayOf(r, r, r, r, 0f, 0f, 0f, 0f)
                      }
                      setPadding(dp(16), dp(10), dp(16), dp(12))
                  }
                  bar.addView(label("Live preview (touch the bubble to see the dark effect and feel the vibration)", 12f, TEXT_DIM).apply {
                      setPadding(0, 0, 0, dp(6))
                  })
                  bar.addView(stage)

                  val col = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(dp(16), dp(24), dp(16), dp(20))
                  }

                  fun add(v: View) {
                      col.addView(
                          v,
                          LinearLayout.LayoutParams(
                              LinearLayout.LayoutParams.MATCH_PARENT,
                              LinearLayout.LayoutParams.WRAP_CONTENT
                          ).apply { bottomMargin = dp(12) }
                      )
                  }

                  // Header with Day / Night button
                  val header = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER_VERTICAL
                      setPadding(dp(4), 0, 0, dp(4))
                  }
                  val titleBox = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL }
                  titleBox.addView(label("Timer Pro", 28f, TEXT_MAIN, true))
                  titleBox.addView(label("A small timer that floats over every app", 13.5f, TEXT_DIM))
                  header.addView(titleBox, LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f))
                  header.addView(smallBtn("Theme: ${themeName()}") {
                      prefs.edit().putInt(Prefs.THEME, (prefs.getInt(Prefs.THEME, 0) + 1) % 3).apply()
                      recreate()
                  })
                  add(header)

                  // Permission
                  val pm = card("Setup")
                  permStatus = label("", 13.5f, TEXT_MAIN).apply { setPadding(0, dp(6), 0, dp(8)) }
                  permBtn = pill("Allow display over other apps", if (night) 0xFF39425F.toInt() else 0xFF5B6B86.toInt()) {
                      askOverlayPermission()
                  }
                  pm.addView(permStatus)
                  pm.addView(permBtn)
                  add(pm)

                  // Timer
                  val tm = card("Timer", "The bubble appears paused. Tap it to start / pause, tap ↺ to reset. Hold it for a moment for controls.")
                  val seg = LinearLayout(this).apply { orientation = LinearLayout.HORIZONTAL }
                  fun paintSeg() {
                      val cd = prefs.getBoolean(Prefs.COUNTDOWN, true)
                      btnCountdown.background = rounded(if (cd) ACCENT else BG_BTN, 12)
                      btnCountdown.setTextColor(if (cd) Color.WHITE else TEXT_MAIN)
                      btnStopwatch.background = rounded(if (!cd) ACCENT else BG_BTN, 12)
                      btnStopwatch.setTextColor(if (!cd) Color.WHITE else TEXT_MAIN)
                  }
                  btnCountdown = pill("Countdown", ACCENT) {
                      prefs.edit().putBoolean(Prefs.COUNTDOWN, true).apply()
                      paintSeg()
                  }
                  btnStopwatch = pill("Stopwatch", ACCENT) {
                      prefs.edit().putBoolean(Prefs.COUNTDOWN, false).apply()
                      paintSeg()
                  }
                  paintSeg()
                  seg.addView(
                      btnCountdown,
                      LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f).apply { rightMargin = dp(4) }
                  )
                  seg.addView(
                      btnStopwatch,
                      LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f).apply { leftMargin = dp(4) }
                  )
                  addGap(tm, 10)
                  tm.addView(seg)

                  tm.addView(label("Countdown time (HH : MM : SS)", 13.5f, TEXT_DIM).apply {
                      setPadding(0, dp(14), 0, dp(4))
                  })
                  val total = prefs.getInt(Prefs.TOTAL_SECS, prefs.getInt(Prefs.MINUTES, 25) * 60).coerceIn(1, 359999)
                  tH = timeField(total / 3600)
                  tM = timeField((total % 3600) / 60)
                  tS = timeField(total % 60)
                  val tRow = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER_VERTICAL
                  }
                  fun colon() = label(":", 26f, TEXT_DIM, true).apply { gravity = Gravity.CENTER }
                  tRow.addView(tH, LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f))
                  tRow.addView(colon(), LinearLayout.LayoutParams(dp(18), LinearLayout.LayoutParams.WRAP_CONTENT))
                  tRow.addView(tM, LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f))
                  tRow.addView(colon(), LinearLayout.LayoutParams(dp(18), LinearLayout.LayoutParams.WRAP_CONTENT))
                  tRow.addView(tS, LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f))
                  tm.addView(tRow)

                  addGap(tm, 8)
                  val quick = LinearLayout(this).apply { orientation = LinearLayout.HORIZONTAL }
                  listOf(5, 10, 25, 60).forEach { mn ->
                      quick.addView(
                          smallBtn("$mn min") { showSeconds(mn * 60) },
                          LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f)
                              .apply { setMargins(dp(2), 0, dp(2), 0) }
                      )
                  }
                  tm.addView(quick)
                  tm.addView(label("Stopwatch mode counts up from zero and ignores this time.", 12f, TEXT_DIM).apply {
                      setPadding(0, dp(8), 0, 0)
                  })
                  addGap(tm, 12)
                  tm.addView(pill("▶  Show floating bubble", ACCENT) { startTimer() })
                  addGap(tm, 8)
                  tm.addView(pill("■  Stop and remove bubble", 0xFFC62F3A.toInt()) { stopTimer() })
                  add(tm)

                  // Colours
                  add(colorCard("Bubble color", "Background of the bubble", Prefs.BG, Prefs.DEF_BG))
                  add(colorCard("Text color", "Color of the time digits", Prefs.FG, Color.WHITE))

                  // Style
                  val sh = card("Bubble style")
                  sliderRow(sh, "Roundness", 0, 100, Prefs.RADIUS, 100) {
                      when {
                          it <= 0 -> "Square"
                          it >= 100 -> "Fully round"
                          else -> "$it%"
                      }
                  }
                  sliderRow(sh, "Size", 8, 40, Prefs.SIZE, Prefs.DEF_SIZE) { "$it" }
                  sliderRow(sh, "Opacity", 30, 100, Prefs.ALPHA, 90) { "$it%" }
                  addGap(sh, 12)
                  sh.addView(mkSwitch("Show milliseconds in the bubble", Prefs.SHOW_MS, false) { refreshAll() })
                  add(sh)

                  // Touch feedback
                  val tf = card("Touch feedback", "What happens when you touch the bubble")
                  addGap(tf, 6)
                  tf.addView(mkSwitch("Dark effect when touched", Prefs.SHADOW_ON, true) { refreshAll() })
                  sliderRow(tf, "Dark effect strength", 0, 100, Prefs.SHADOW_AMT, 60) { "$it%" }
                  addGap(tf, 12)
                  tf.addView(mkSwitch("Vibrate when touched", Prefs.HAPTIC_ON, true))
                  sliderRow(tf, "Vibration strength", 1, 100, Prefs.HAPTIC_AMT, 50) { "$it%" }
                  add(tf)

                  // Alarm
                  val sd = card("Alarm", "What happens when the countdown ends")
                  addGap(sd, 6)
                  sd.addView(mkSwitch("Play sound", Prefs.SOUND_ON, true))
                  addGap(sd, 6)
                  sd.addView(mkSwitch("Vibrate", Prefs.VIB_ON, true))
                  sd.addView(label("Choose a sound", 13.5f, TEXT_DIM).apply { setPadding(0, dp(14), 0, dp(2)) })
                  Synth.NAMES.forEach { (id, name) -> soundRow(sd, id, name) }
                  soundRow(sd, "phone", "Phone alarm sound", "Your phone's default alarm")
                  soundRow(sd, "custom", "My own sound")
                  sliderRow(sd, "Ring for", 5, 60, Prefs.RING_SECS, 20) { "$it sec" }
                  add(sd)
                  updateCustomName()
                  updateSoundMarks()

                  // Tips
                  val tp = card("Good to know")
                  tp.addView(
                      label(
                          "• Tap the bubble: start / pause (also silences the alarm)\n" +
                              "• Tap the ↺ icon on the bubble: reset the timer\n" +
                              "• Hold the bubble for a moment: open the control panel\n" +
                              "• Tap anywhere else on the screen to close the panel\n" +
                              "• Drag the bubble to move it\n" +
                              "• All settings are saved automatically\n" +
                              "• If the timer stops in the background: Settings > Apps > Timer Pro > " +
                              "Battery > Unrestricted",
                          13.5f, TEXT_DIM
                      ).apply { setPadding(0, dp(8), 0, 0); setLineSpacing(0f, 1.15f) }
                  )
                  add(tp)

                  val scroll = ScrollView(this).apply {
                      setBackgroundColor(BG_PAGE)
                      isFillViewport = true
                      addView(col)
                  }
                  val rootLayout = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setBackgroundColor(BG_PAGE)
                  }
                  rootLayout.addView(
                      scroll,
                      LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, 0, 1f)
                  )
                  rootLayout.addView(
                      bar,
                      LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT,
                          LinearLayout.LayoutParams.WRAP_CONTENT
                      )
                  )
                  return rootLayout
              }
          }
