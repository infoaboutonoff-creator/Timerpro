name: Build Timer Pro

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Create project files
        run: |
          mkdir -p $(dirname 'settings.gradle.kts')
          cat > 'settings.gradle.kts' <<'EOF_FILE'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "FloatingTimer"
          include(":app")
          EOF_FILE

          mkdir -p $(dirname 'build.gradle.kts')
          cat > 'build.gradle.kts' <<'EOF_FILE'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF_FILE

          mkdir -p $(dirname 'gradle.properties')
          cat > 'gradle.properties' <<'EOF_FILE'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          kotlin.code.style=official
          android.nonTransitiveRClass=true
          EOF_FILE

          mkdir -p $(dirname 'app/build.gradle.kts')
          cat > 'app/build.gradle.kts' <<'EOF_FILE'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.example.floatingtimer"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.fresh2026.timerpro"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 4
                  versionName = "2.2"
              }

              signingConfigs {
                  getByName("debug") {
                      storeFile = file("../fixed.p12")
                      storePassword = "android"
                      keyAlias = "androiddebugkey"
                      keyPassword = "android"
                  }
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          EOF_FILE

          mkdir -p $(dirname 'app/src/main/AndroidManifest.xml')
          cat > 'app/src/main/AndroidManifest.xml' <<'EOF_FILE'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <!-- No INTERNET permission on purpose: this app cannot send data anywhere -->
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_SPECIAL_USE" />
              <uses-permission android:name="android.permission.VIBRATE" />
              <uses-permission android:name="android.permission.WAKE_LOCK" />

              <application
                  android:allowBackup="true"
                  android:icon="@drawable/ic_launcher"
                  android:label="Timer Pro"
                  android:theme="@style/AppTheme">

                  <activity
                      android:name="com.example.floatingtimer.MainActivity"
                      android:windowSoftInputMode="adjustResize"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name="com.example.floatingtimer.TimerService"
                      android:exported="false"
                      android:foregroundServiceType="specialUse">
                      <property
                          android:name="android.app.PROPERTY_SPECIAL_USE_FGS_SUBTYPE"
                          android:value="floating_timer_overlay" />
                  </service>
              </application>
          </manifest>
          EOF_FILE

          mkdir -p $(dirname 'app/src/main/res/values/themes.xml')
          cat > 'app/src/main/res/values/themes.xml' <<'EOF_FILE'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme" parent="android:Theme.Material.NoActionBar">
                  <item name="android:windowBackground">#0E1320</item>
                  <item name="android:statusBarColor">#0E1320</item>
                  <item name="android:navigationBarColor">#0E1320</item>
              </style>
          </resources>
          EOF_FILE

          mkdir -p $(dirname 'app/src/main/res/drawable/ic_launcher.xml')
          cat > 'app/src/main/res/drawable/ic_launcher.xml' <<'EOF_FILE'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path
                  android:fillColor="#2979FF"
                  android:pathData="M54,54m-50,0a50,50 0,1 1,100 0a50,50 0,1 1,-100 0" />
              <path
                  android:fillColor="#00000000"
                  android:strokeColor="#FFFFFF"
                  android:strokeWidth="6"
                  android:strokeLineCap="round"
                  android:strokeLineJoin="round"
                  android:pathData="M54,28L54,54L72,66" />
          </vector>
          EOF_FILE

          mkdir -p $(dirname 'app/src/main/java/com/example/floatingtimer/Prefs.kt')
          cat > 'app/src/main/java/com/example/floatingtimer/Prefs.kt' <<'EOF_FILE'
          package com.example.floatingtimer

          import android.content.Context
          import android.content.SharedPreferences
          import android.graphics.Color
          import android.graphics.Typeface
          import android.graphics.drawable.Drawable
          import android.graphics.drawable.GradientDrawable
          import android.graphics.drawable.LayerDrawable
          import android.os.Build
          import android.os.VibrationEffect
          import android.os.Vibrator
          import android.os.VibratorManager
          import android.view.Gravity
          import android.view.View
          import android.widget.FrameLayout
          import android.widget.LinearLayout
          import android.widget.TextView

          object Prefs {
              const val NAME = "settings_v2"
              const val BG = "bg_color"
              const val FG = "text_color"
              const val RADIUS = "radius"
              const val SIZE = "size"
              const val ALPHA = "alpha"
              const val SOUND_ON = "sound_on"
              const val VIB_ON = "vib_on"
              const val SOUND_ID = "sound_id"
              const val SOUND_URI = "sound_uri"
              const val RING_SECS = "ring_secs"
              const val COUNTDOWN = "countdown"
              const val MINUTES = "minutes"
              const val TOTAL_SECS = "total_secs"
              const val SHOW_MS = "show_ms"
              const val THEME = "theme"
              const val SHADOW_ON = "touch_shadow_on"
              const val SHADOW_AMT = "touch_shadow_amt"
              const val HAPTIC_ON = "touch_vib_on"
              const val HAPTIC_AMT = "touch_vib_amt"
              const val X = "x"
              const val Y = "y"

              const val DEF_SIZE = 14
              val DEF_BG = 0xFF2979FF.toInt()

              val PALETTE = intArrayOf(
                  0xFFF44336.toInt(), 0xFFE91E63.toInt(), 0xFF9C27B0.toInt(),
                  0xFF673AB7.toInt(), 0xFF3F51B5.toInt(), 0xFF2196F3.toInt(),
                  0xFF03A9F4.toInt(), 0xFF00BCD4.toInt(), 0xFF009688.toInt(),
                  0xFF4CAF50.toInt(), 0xFF8BC34A.toInt(), 0xFFCDDC39.toInt(),
                  0xFFFFEB3B.toInt(), 0xFFFFC107.toInt(), 0xFFFF9800.toInt(),
                  0xFFFF5722.toInt(), 0xFF795548.toInt(), 0xFF9E9E9E.toInt(),
                  0xFF607D8B.toInt(), 0xFF000000.toInt(), 0xFFFFFFFF.toInt(),
                  0xFF0D47A1.toInt(), 0xFF8E0000.toInt(), 0xFF69F0AE.toInt()
              )
          }

          fun Context.dp(v: Int): Int = (v * resources.displayMetrics.density).toInt()

          /**
           * Shadow layer behind the bubble. It must not decide the size of its parent,
           * so it measures 0 unless the parent gives it an exact size.
           */
          class HaloView(ctx: Context) : View(ctx) {
              override fun onMeasure(widthMeasureSpec: Int, heightMeasureSpec: Int) {
                  val w = if (MeasureSpec.getMode(widthMeasureSpec) == MeasureSpec.EXACTLY)
                      MeasureSpec.getSize(widthMeasureSpec) else 0
                  val h = if (MeasureSpec.getMode(heightMeasureSpec) == MeasureSpec.EXACTLY)
                      MeasureSpec.getSize(heightMeasureSpec) else 0
                  setMeasuredDimension(w, h)
              }
          }

          /**
           * The floating bubble: time text + small reset icon inside a rounded box,
           * with a soft shadow ("halo") behind it that appears while it is touched.
           * Used by the floating service and by the live preview in the app.
           */
          class BubbleViews(ctx: Context) {
              val time = TextView(ctx).apply { gravity = Gravity.CENTER }
              val reset = TextView(ctx).apply {
                  text = "↺"
                  gravity = Gravity.CENTER
              }
              val box = LinearLayout(ctx).apply {
                  orientation = LinearLayout.HORIZONTAL
                  gravity = Gravity.CENTER_VERTICAL
              }
              val halo = HaloView(ctx).apply { alpha = 0f }
              val holder = FrameLayout(ctx)
              val pad: Int = 0

              init {
                  box.addView(time)
                  box.addView(reset)
                  holder.setPadding(pad, pad, pad, pad)
                  holder.addView(
                      box,
                      FrameLayout.LayoutParams(
                          FrameLayout.LayoutParams.WRAP_CONTENT,
                          FrameLayout.LayoutParams.WRAP_CONTENT
                      )
                  )
                  holder.addView(
                      halo,
                      FrameLayout.LayoutParams(
                          FrameLayout.LayoutParams.MATCH_PARENT,
                          FrameLayout.LayoutParams.MATCH_PARENT
                      )
                  )
              }

              /** Applies colours, size, roundness and the shadow size from the saved settings. */
              fun applyStyle(p: SharedPreferences, bgOverride: Int? = null) {
                  val d = box.resources.displayMetrics.density
                  val size = p.getInt(Prefs.SIZE, Prefs.DEF_SIZE)
                  val radius = p.getInt(Prefs.RADIUS, 100)
                  val fg = p.getInt(Prefs.FG, Color.WHITE)

                  time.typeface = Typeface.create(Typeface.MONOSPACE, Typeface.BOLD)
                  time.textSize = size.toFloat()
                  time.setTextColor(fg)
                  reset.textSize = size * 0.95f
                  reset.setTextColor(fg)
                  reset.alpha = 0.85f

                  val padH = (size * d * 0.9f).toInt()
                  val padV = (size * d * 0.45f).toInt()
                  box.setPadding(padH, padV, (padH * 0.4f).toInt(), padV)
                  val gap = (size * d * 0.35f).toInt()
                  reset.setPadding(gap, 0, gap, 0)

                  val fm = time.paint.fontMetrics
                  val estH = (fm.bottom - fm.top) + 2 * padV
                  val corner = estH / 2f * radius / 100f
                  box.background = GradientDrawable().apply {
                      setColor(bgOverride ?: p.getInt(Prefs.BG, Prefs.DEF_BG))
                      cornerRadius = corner
                  }

                  // Dark "pressed" effect: a dark layer over the bubble while it is touched
                  val amt = p.getInt(Prefs.SHADOW_AMT, 60).coerceIn(0, 100)
                  halo.background = GradientDrawable().apply {
                      setColor(Color.argb((30f + 150f * amt / 100f).toInt().coerceIn(0, 255), 0, 0, 0))
                      cornerRadius = corner
                  }
              }

              /** Shows or hides the dark pressed effect (only if the option is on). */
              fun showHalo(on: Boolean, p: SharedPreferences) {
                  halo.animate().cancel()
                  if (!p.getBoolean(Prefs.SHADOW_ON, true)) {
                      halo.alpha = 0f
                      return
                  }
                  halo.animate().alpha(if (on) 1f else 0f).setDuration(if (on) 80L else 160L).start()
              }
          }

          /** A short vibration when the bubble is touched. Strength comes from the settings. */
          @Suppress("DEPRECATION")
          fun touchBuzz(ctx: Context, p: SharedPreferences, mult: Float = 1f) {
              if (!p.getBoolean(Prefs.HAPTIC_ON, true)) return
              val amt = p.getInt(Prefs.HAPTIC_AMT, 50).coerceIn(1, 100)
              val dur = ((10f + amt * 0.4f) * mult).toLong().coerceAtLeast(5L)
              val amp = (30f + amt * 2.2f).toInt().coerceIn(1, 255)
              try {
                  val v: Vibrator? = if (Build.VERSION.SDK_INT >= 31) {
                      ctx.getSystemService(VibratorManager::class.java)?.defaultVibrator
                  } else {
                      ctx.getSystemService(Vibrator::class.java)
                  }
                  if (v == null) return
                  val effect = if (v.hasAmplitudeControl()) {
                      VibrationEffect.createOneShot(dur, amp)
                  } else {
                      VibrationEffect.createOneShot(dur, VibrationEffect.DEFAULT_AMPLITUDE)
                  }
                  v.vibrate(effect)
              } catch (e: Exception) {
              }
          }
          EOF_FILE

          mkdir -p $(dirname 'app/src/main/java/com/example/floatingtimer/Sound.kt')
          cat > 'app/src/main/java/com/example/floatingtimer/Sound.kt' <<'EOF_FILE'
          package com.example.floatingtimer

          import android.content.Context
          import android.media.AudioAttributes
          import android.media.AudioFormat
          import android.media.AudioTrack
          import android.media.Ringtone
          import android.media.RingtoneManager
          import android.net.Uri
          import android.os.Build
          import kotlin.math.PI
          import kotlin.math.abs
          import kotlin.math.exp
          import kotlin.math.min
          import kotlin.math.sin

          /** Builds the alarm sounds in code, so no sound files are needed. */
          object Synth {
              const val RATE = 22050

              val NAMES = listOf(
                  "bell" to "Classic Bell",
                  "beep" to "Digital Beep",
                  "chime" to "Soft Chime",
                  "rising" to "Rising Alarm",
                  "siren" to "Siren",
                  "dingdong" to "Ding-Dong"
              )

              private class Mix(seconds: Float) {
                  val buf = FloatArray((RATE * seconds).toInt())

                  fun note(
                      start: Float, dur: Float, freq: Float, vol: Float, decay: Float,
                      harm: List<Pair<Float, Float>> = listOf(1f to 1f), square: Boolean = false
                  ) {
                      val s = (start * RATE).toInt()
                      val n = (dur * RATE).toInt()
                      for (i in 0 until n) {
                          val idx = s + i
                          if (idx >= buf.size) break
                          val t = i.toFloat() / RATE
                          var env = min(1f, t / 0.004f) * exp(-decay * t)
                          val tail = dur - t
                          if (tail < 0.02f) env *= tail / 0.02f
                          var v = 0f
                          for ((ratio, amp) in harm) {
                              v += amp * sin(2.0 * PI * freq * ratio * t).toFloat()
                          }
                          if (square) v = if (v >= 0f) 0.6f else -0.6f
                          buf[idx] += v * vol * env
                      }
                  }

                  fun pcm(): ShortArray {
                      var peak = 0.0001f
                      for (x in buf) peak = maxOf(peak, abs(x))
                      val g = 0.9f / peak
                      return ShortArray(buf.size) {
                          (buf[it] * g * 32767f).toInt().coerceIn(-32768, 32767).toShort()
                      }
                  }
              }

              fun build(id: String): ShortArray = when (id) {
                  "beep" -> {
                      val m = Mix(1.0f)
                      for (i in 0 until 4) m.note(i * 0.18f, 0.1f, 1200f, 1f, 0f, square = true)
                      m.pcm()
                  }
                  "chime" -> {
                      val m = Mix(2.4f)
                      val h = listOf(1f to 1f, 2f to 0.25f)
                      val notes = floatArrayOf(1046.5f, 1318.5f, 1568f, 2093f)
                      for (i in notes.indices) m.note(i * 0.28f, 1.1f, notes[i], 1f, 3.5f, h)
                      m.pcm()
                  }
                  "rising" -> {
                      val m = Mix(1.4f)
                      val h = listOf(1f to 1f, 2f to 0.3f, 3f to 0.15f)
                      val f = floatArrayOf(600f, 800f, 1000f, 1300f)
                      for (i in f.indices) m.note(i * 0.28f, 0.22f, f[i], 1f, 0f, h)
                      m.pcm()
                  }
                  "siren" -> {
                      val m = Mix(1.6f)
                      var phase = 0.0
                      for (i in m.buf.indices) {
                          val t = i.toDouble() / RATE
                          val f = 900.0 + 350.0 * sin(2.0 * PI * t / 1.6)
                          phase += 2.0 * PI * f / RATE
                          m.buf[i] = (0.6 * sin(phase)).toFloat()
                      }
                      m.pcm()
                  }
                  "dingdong" -> {
                      val m = Mix(2.2f)
                      val h = listOf(1f to 1f, 2f to 0.35f, 3f to 0.1f)
                      m.note(0f, 1.0f, 880f, 1f, 3f, h)
                      m.note(0.6f, 1.4f, 660f, 1f, 2.5f, h)
                      m.pcm()
                  }
                  else -> {
                      val m = Mix(2.2f)
                      val bell = listOf(1f to 1f, 2f to 0.55f, 2.76f to 0.4f, 5.4f to 0.2f)
                      m.note(0f, 1.6f, 784f, 1f, 3.2f, bell)
                      m.note(0.7f, 1.4f, 784f, 1f, 3.2f, bell)
                      m.pcm()
                  }
              }
          }

          /** Plays a built-in sound, the phone's alarm sound, or a sound picked from the phone (looping until stop()). */
          class SoundPlayer(private val ctx: Context) {
              private var track: AudioTrack? = null
              private var ringtone: Ringtone? = null

              var isPlaying = false
                  private set

              private fun attrs() = AudioAttributes.Builder()
                  .setUsage(AudioAttributes.USAGE_ALARM)
                  .setContentType(AudioAttributes.CONTENT_TYPE_SONIFICATION)
                  .build()

              fun play(id: String, uri: String?) {
                  stop()
                  try {
                      when (id) {
                          "phone" -> playRingtone(RingtoneManager.getDefaultUri(RingtoneManager.TYPE_ALARM))
                          "custom" -> playRingtone(
                              if (uri.isNullOrEmpty()) RingtoneManager.getDefaultUri(RingtoneManager.TYPE_ALARM)
                              else Uri.parse(uri)
                          )
                          else -> playSynth(id)
                      }
                      isPlaying = true
                  } catch (e: Exception) {
                      isPlaying = false
                  }
              }

              private fun playRingtone(uri: Uri?) {
                  val r = RingtoneManager.getRingtone(
                      ctx, uri ?: RingtoneManager.getDefaultUri(RingtoneManager.TYPE_NOTIFICATION)
                  ) ?: return
                  r.audioAttributes = attrs()
                  if (Build.VERSION.SDK_INT >= 28) r.isLooping = true
                  r.play()
                  ringtone = r
              }

              private fun playSynth(id: String) {
                  val data = Synth.build(id)
                  val t = AudioTrack.Builder()
                      .setAudioAttributes(attrs())
                      .setAudioFormat(
                          AudioFormat.Builder()
                              .setEncoding(AudioFormat.ENCODING_PCM_16BIT)
                              .setSampleRate(Synth.RATE)
                              .setChannelMask(AudioFormat.CHANNEL_OUT_MONO)
                              .build()
                      )
                      .setBufferSizeInBytes(data.size * 2)
                      .setTransferMode(AudioTrack.MODE_STATIC)
                      .build()
                  t.write(data, 0, data.size)
                  t.setLoopPoints(0, data.size, -1)
                  t.play()
                  track = t
              }

              fun stop() {
                  try {
                      track?.stop()
                  } catch (e: Exception) {
                  }
                  try {
                      track?.release()
                  } catch (e: Exception) {
                  }
                  track = null
                  try {
                      ringtone?.stop()
                  } catch (e: Exception) {
                  }
                  ringtone = null
                  isPlaying = false
              }
          }
          EOF_FILE

          mkdir -p $(dirname 'app/src/main/java/com/example/floatingtimer/TimerService.kt')
          cat > 'app/src/main/java/com/example/floatingtimer/TimerService.kt' <<'EOF_FILE'
          package com.example.floatingtimer

          import android.annotation.SuppressLint
          import android.app.Notification
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.PendingIntent
          import android.app.Service
          import android.content.Intent
          import android.content.SharedPreferences
          import android.content.pm.ServiceInfo
          import android.content.res.Configuration
          import android.graphics.Color
          import android.graphics.PixelFormat
          import android.graphics.drawable.GradientDrawable
          import android.os.Build
          import android.os.Handler
          import android.os.IBinder
          import android.os.Looper
          import android.os.PowerManager
          import android.os.SystemClock
          import android.os.VibrationEffect
          import android.os.Vibrator
          import android.os.VibratorManager
          import android.provider.Settings
          import android.util.DisplayMetrics
          import android.view.Gravity
          import android.view.MotionEvent
          import android.view.View
          import android.view.ViewConfiguration
          import android.view.WindowManager
          import android.widget.Button
          import android.widget.LinearLayout
          import java.util.Locale
          import kotlin.math.abs
          import kotlin.math.max

          /**
           * Foreground service that shows the floating bubble over other apps.
           * Tap = start / pause. Tap the small reset icon = reset. Hold ~0.3 s = open the control panel.
           * Drag = move (all the way to the screen edges). Tap anywhere outside = close the panel.
           * Time is measured with elapsedRealtime, so it stays correct with the screen off.
           */
          class TimerService : Service() {

              companion object {
                  const val ACTION_REFRESH = "com.example.floatingtimer.REFRESH"
                  const val ACTION_STOP = "com.example.floatingtimer.STOP"
                  const val EXTRA_SECONDS = "seconds"
                  const val EXTRA_AUTOSTART = "autostart"

                  private const val CH_RUN = "timer_running"
                  private const val CH_DONE = "timer_done"
                  private const val ID_RUN = 1
                  private const val ID_DONE = 2
                  private const val LONG_PRESS_MS = 300L

                  @Volatile
                  var isRunning = false
              }

              private lateinit var prefs: SharedPreferences
              private lateinit var nm: NotificationManager

              private var wm: WindowManager? = null
              private var root: LinearLayout? = null
              private lateinit var bubble: BubbleViews
              private lateinit var panel: LinearLayout
              private lateinit var btnStart: Button
              private lateinit var btnMode: Button
              private lateinit var rowPresets: LinearLayout
              private lateinit var rowAdjust: LinearLayout
              private lateinit var lp: WindowManager.LayoutParams

              // position to go back to when the panel closes (if opening it had to move the bubble)
              private var restoreX: Int? = null
              private var restoreY: Int? = null

              private val handler = Handler(Looper.getMainLooper())
              private val sound by lazy { SoundPlayer(this) }

              // ---- Timer state ----
              private var countdown = true
              private var running = false
              private var finished = false
              private var presetMs = 25 * 60_000L
              private var accumulated = 0L
              private var startedAt = 0L
              private var lastNotifSecond = -1L

              private var wakeLock: PowerManager.WakeLock? = null

              private val soundStopper = Runnable { sound.stop() }

              private val tick = object : Runnable {
                  override fun run() {
                      if (!running) return
                      if (countdown && elapsed() >= presetMs) {
                          onFinish()
                          return
                      }
                      refreshUi()
                      handler.postDelayed(this, if (showMs()) 33L else 200L)
                  }
              }

              // ---------- Service lifecycle ----------

              override fun onCreate() {
                  super.onCreate()
                  prefs = getSharedPreferences(Prefs.NAME, MODE_PRIVATE)
                  nm = getSystemService(NotificationManager::class.java)
                  createChannels()
              }

              override fun onBind(intent: Intent?): IBinder? = null

              override fun onConfigurationChanged(newConfig: Configuration) {
                  super.onConfigurationChanged(newConfig)
                  root?.post { clampToScreen() }
              }

              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  if (intent?.action == ACTION_STOP) {
                      stopSelf()
                      return START_NOT_STICKY
                  }

                  startAsForeground()

                  if (root == null) {
                      if (!Settings.canDrawOverlays(this)) {
                          stopSelf()
                          return START_NOT_STICKY
                      }
                      countdown = prefs.getBoolean(Prefs.COUNTDOWN, true)
                      presetMs = prefs.getInt(Prefs.TOTAL_SECS, prefs.getInt(Prefs.MINUTES, 25) * 60)
                          .coerceIn(1, 359999) * 1000L
                      buildOverlay()
                      isRunning = true
                  }

                  intent?.let {
                      if (it.hasExtra(EXTRA_SECONDS)) {
                          countdown = prefs.getBoolean(Prefs.COUNTDOWN, true)
                          presetMs = it.getIntExtra(EXTRA_SECONDS, 1500).coerceIn(1, 359999) * 1000L
                          resetTimer()
                          if (it.getBooleanExtra(EXTRA_AUTOSTART, false)) start()
                      }
                      if (it.action == ACTION_REFRESH) applyStyle()
                  }
                  refreshUi()
                  return START_NOT_STICKY
              }

              override fun onDestroy() {
                  handler.removeCallbacksAndMessages(null)
                  sound.stop()
                  releaseWake()
                  try {
                      root?.let { wm?.removeView(it) }
                  } catch (e: Exception) {
                  }
                  root = null
                  isRunning = false
                  super.onDestroy()
              }

              // ---------- Notifications ----------

              private fun createChannels() {
                  nm.createNotificationChannel(
                      NotificationChannel(CH_RUN, "Timer running", NotificationManager.IMPORTANCE_LOW)
                  )
                  val done = NotificationChannel(CH_DONE, "Timer finished", NotificationManager.IMPORTANCE_HIGH)
                  done.setSound(null, null)
                  done.enableVibration(false)
                  nm.createNotificationChannel(done)
              }

              private fun openAppIntent(): PendingIntent = PendingIntent.getActivity(
                  this, 0, Intent(this, MainActivity::class.java), PendingIntent.FLAG_IMMUTABLE
              )

              @Suppress("DEPRECATION")
              private fun runningNotification(text: String): Notification {
                  val stop = PendingIntent.getService(
                      this, 1,
                      Intent(this, TimerService::class.java).setAction(ACTION_STOP),
                      PendingIntent.FLAG_IMMUTABLE
                  )
                  return Notification.Builder(this, CH_RUN)
                      .setSmallIcon(android.R.drawable.ic_lock_idle_alarm)
                      .setContentTitle("Timer Pro")
                      .setContentText(text)
                      .setContentIntent(openAppIntent())
                      .setOngoing(true)
                      .setOnlyAlertOnce(true)
                      .addAction(0, "Stop", stop)
                      .build()
              }

              private fun startAsForeground() {
                  val n = runningNotification(fmt(shownMs(), false))
                  if (Build.VERSION.SDK_INT >= 34) {
                      startForeground(ID_RUN, n, ServiceInfo.FOREGROUND_SERVICE_TYPE_SPECIAL_USE)
                  } else {
                      startForeground(ID_RUN, n)
                  }
              }

              private fun notifyDone() {
                  val n = Notification.Builder(this, CH_DONE)
                      .setSmallIcon(android.R.drawable.ic_lock_idle_alarm)
                      .setContentTitle("Time's up!")
                      .setContentText("Your timer has finished")
                      .setContentIntent(openAppIntent())
                      .setAutoCancel(true)
                      .build()
                  nm.notify(ID_DONE, n)
              }

              // ---------- Screen helpers ----------

              @Suppress("DEPRECATION")
              private fun screenSize(): Pair<Int, Int> {
                  val dm = DisplayMetrics()
                  wm?.defaultDisplay?.getRealMetrics(dm)
                  return Pair(dm.widthPixels, dm.heightPixels)
              }

              /** The bubble itself may touch every screen edge (the transparent ring around it may go off-screen). */
              private fun limitX(v: Int): Int {
                  val (sw, _) = screenSize()
                  val hi = max(sw - bubble.box.width - bubble.pad, -bubble.pad)
                  return v.coerceIn(-bubble.pad, hi)
              }

              private fun limitY(v: Int): Int {
                  val (_, sh) = screenSize()
                  val hi = max(sh - bubble.box.height - bubble.pad, -bubble.pad)
                  return v.coerceIn(-bubble.pad, hi)
              }

              private fun clampToScreen() {
                  val r = root ?: return
                  if (bubble.box.width == 0) return
                  lp.x = limitX(lp.x)
                  lp.y = limitY(lp.y)
                  try {
                      wm?.updateViewLayout(r, lp)
                  } catch (e: Exception) {
                  }
              }

              // ---------- Overlay (bubble + panel) ----------

              @SuppressLint("ClickableViewAccessibility")
              private fun buildOverlay() {
                  wm = getSystemService(WINDOW_SERVICE) as WindowManager

                  val r = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      gravity = Gravity.START
                  }

                  bubble = BubbleViews(this)

                  panel = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      minimumWidth = dp(250)
                      setPadding(dp(8), dp(8), dp(8), dp(8))
                      background = GradientDrawable().apply {
                          setColor(0xF0151B2B.toInt())
                          cornerRadius = dp(18).toFloat()
                      }
                      visibility = View.GONE
                  }

                  btnStart = mkBtn("", 0xFF4F8CFF.toInt()) { toggleRun() }
                  btnMode = mkBtn("", 0xFF2A3350.toInt()) {
                      countdown = !countdown
                      prefs.edit().putBoolean(Prefs.COUNTDOWN, countdown).apply()
                      resetTimer()
                  }
                  rowPresets = row(
                      mkBtn("5 min") { setPreset(5) },
                      mkBtn("10") { setPreset(10) },
                      mkBtn("25") { setPreset(25) },
                      mkBtn("60") { setPreset(60) }
                  )
                  rowAdjust = row(
                      mkBtn("-10s") { adjust(-10) },
                      mkBtn("+10s") { adjust(10) },
                      mkBtn("+1m") { adjust(60) },
                      mkBtn("+5m") { adjust(300) }
                  )

                  panel.addView(row(btnStart, mkBtn("Reset") { resetTimer() }))
                  panel.addView(row(btnMode))
                  panel.addView(rowPresets)
                  panel.addView(rowAdjust)
                  panel.addView(row(mkBtn("Hide panel") { togglePanel() }, mkBtn("Exit", 0xFFE5484D.toInt()) { stopSelf() }))

                  r.addView(
                      bubble.holder,
                      LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.WRAP_CONTENT,
                          LinearLayout.LayoutParams.WRAP_CONTENT
                      )
                  )
                  r.addView(
                      panel,
                      LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.WRAP_CONTENT,
                          LinearLayout.LayoutParams.WRAP_CONTENT
                      ).apply { topMargin = dp(2) }
                  )

                  lp = WindowManager.LayoutParams(
                      WindowManager.LayoutParams.WRAP_CONTENT,
                      WindowManager.LayoutParams.WRAP_CONTENT,
                      WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or
                          WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN or
                          WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS or
                          WindowManager.LayoutParams.FLAG_WATCH_OUTSIDE_TOUCH,
                      PixelFormat.TRANSLUCENT
                  ).apply {
                      gravity = Gravity.TOP or Gravity.START
                      x = prefs.getInt(Prefs.X, dp(24))
                      y = prefs.getInt(Prefs.Y, dp(120))
                  }

                  // A tap outside the window (anywhere else on the screen) closes the panel
                  r.setOnTouchListener { _, e ->
                      if (e.action == MotionEvent.ACTION_OUTSIDE && panel.visibility == View.VISIBLE) {
                          togglePanel()
                      }
                      false
                  }

                  // Tap = start/pause, tap reset icon = reset, hold = panel, drag = move
                  val slop = ViewConfiguration.get(this).scaledTouchSlop
                  var downX = 0f
                  var downY = 0f
                  var startX = 0
                  var startY = 0
                  var moved = false
                  var longDone = false
                  var onReset = false
                  val longRun = Runnable {
                      longDone = true
                      touchBuzz(this, prefs, 1.6f)
                      togglePanel()
                  }
                  bubble.holder.setOnTouchListener { _, e ->
                      when (e.action) {
                          MotionEvent.ACTION_DOWN -> {
                              downX = e.rawX
                              downY = e.rawY
                              startX = lp.x
                              startY = lp.y
                              moved = false
                              longDone = false
                              val resetLeft = bubble.box.left + bubble.reset.left
                              onReset = e.x >= resetLeft && e.x <= bubble.box.right + bubble.pad / 2
                              bubble.showHalo(true, prefs)
                              touchBuzz(this, prefs)
                              if (!onReset) handler.postDelayed(longRun, LONG_PRESS_MS)
                              true
                          }
                          MotionEvent.ACTION_MOVE -> {
                              val dx = e.rawX - downX
                              val dy = e.rawY - downY
                              if (!moved && (abs(dx) > slop || abs(dy) > slop)) {
                                  moved = true
                                  handler.removeCallbacks(longRun)
                                  restoreX = null
                                  restoreY = null
                              }
                              if (moved) {
                                  lp.x = limitX(startX + dx.toInt())
                                  lp.y = limitY(startY + dy.toInt())
                                  wm?.updateViewLayout(root, lp)
                              }
                              true
                          }
                          MotionEvent.ACTION_UP -> {
                              handler.removeCallbacks(longRun)
                              bubble.showHalo(false, prefs)
                              if (moved) {
                                  prefs.edit().putInt(Prefs.X, lp.x).putInt(Prefs.Y, lp.y).apply()
                              } else if (!longDone) {
                                  if (onReset) onResetTap() else onBubbleTap()
                              }
                              true
                          }
                          MotionEvent.ACTION_CANCEL -> {
                              handler.removeCallbacks(longRun)
                              bubble.showHalo(false, prefs)
                              true
                          }
                          else -> false
                      }
                  }

                  root = r
                  wm?.addView(r, lp)
                  applyStyle()
                  r.post { clampToScreen() }
              }

              private fun onBubbleTap() {
                  if (sound.isPlaying) {
                      stopAlarm()
                      return
                  }
                  toggleRun()
              }

              private fun onResetTap() {
                  stopAlarm()
                  resetTimer()
              }

              private fun togglePanel() {
                  val r = root ?: return
                  val show = panel.visibility != View.VISIBLE
                  panel.visibility = if (show) View.VISIBLE else View.GONE
                  if (show) {
                      // make sure the panel fits on the screen; remember where the bubble was
                      val spec = View.MeasureSpec.makeMeasureSpec(0, View.MeasureSpec.UNSPECIFIED)
                      panel.measure(spec, spec)
                      val needW = max(bubble.holder.width, panel.measuredWidth)
                      val needH = bubble.holder.height + panel.measuredHeight + dp(2)
                      val (sw, sh) = screenSize()
                      var nx = lp.x
                      var ny = lp.y
                      if (lp.x + needW > sw) nx = max(sw - needW, -bubble.pad)
                      if (lp.y + needH > sh) ny = max(sh - needH, -bubble.pad)
                      if (nx != lp.x || ny != lp.y) {
                          restoreX = lp.x
                          restoreY = lp.y
                          lp.x = nx
                          lp.y = ny
                          wm?.updateViewLayout(r, lp)
                      }
                  } else {
                      var changed = false
                      restoreX?.let {
                          lp.x = it
                          changed = true
                      }
                      restoreY?.let {
                          lp.y = it
                          changed = true
                      }
                      restoreX = null
                      restoreY = null
                      if (changed) wm?.updateViewLayout(r, lp)
                  }
              }

              private fun mkBtn(label: String, fill: Int = 0xFF2A3350.toInt(), onClick: () -> Unit) =
                  Button(this).apply {
                      text = label
                      isAllCaps = false
                      textSize = 13f
                      minWidth = 0
                      minimumWidth = 0
                      minHeight = 0
                      minimumHeight = 0
                      setPadding(dp(6), dp(10), dp(6), dp(10))
                      setTextColor(Color.WHITE)
                      background = GradientDrawable().apply {
                          setColor(fill)
                          cornerRadius = dp(10).toFloat()
                      }
                      setOnClickListener { onClick() }
                  }

              private fun row(vararg views: View) = LinearLayout(this).apply {
                  orientation = LinearLayout.HORIZONTAL
                  views.forEach {
                      addView(
                          it,
                          LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f).apply {
                              setMargins(dp(2), dp(2), dp(2), dp(2))
                          }
                      )
                  }
              }

              /** Applies colour, size, roundness, shadow and transparency from the saved settings. */
              private fun applyStyle() {
                  bubble.applyStyle(prefs, if (finished) 0xFFE53935.toInt() else null)
                  root?.alpha = prefs.getInt(Prefs.ALPHA, 90) / 100f
                  bubble.box.alpha = if (!running && !finished && accumulated > 0L) 0.6f else 1f
              }

              // ---------- Timer logic ----------

              private fun elapsed(): Long =
                  accumulated + if (running) SystemClock.elapsedRealtime() - startedAt else 0L

              private fun shownMs(): Long =
                  if (countdown) (presetMs - elapsed()).coerceAtLeast(0L) else elapsed()

              private fun showMs(): Boolean = prefs.getBoolean(Prefs.SHOW_MS, false)

              private fun fmt(ms: Long, withMs: Boolean): String {
                  val total = if (countdown && !withMs) (ms + 999) / 1000 else ms / 1000
                  val h = total / 3600
                  val m = (total % 3600) / 60
                  val s = total % 60
                  val base = if (h > 0) String.format(Locale.US, "%d:%02d:%02d", h, m, s)
                  else String.format(Locale.US, "%02d:%02d", m, s)
                  return if (withMs) base + String.format(Locale.US, ".%03d", ms % 1000) else base
              }

              private fun refreshUi() {
                  val ms = shownMs()
                  val t = fmt(ms, showMs())
                  if (bubble.time.text.toString() != t) bubble.time.text = t
                  btnStart.text = if (running) "Pause" else "Start"
                  btnMode.text = if (countdown) "Mode: Countdown (tap to switch)" else "Mode: Stopwatch (tap to switch)"
                  val vis = if (countdown) View.VISIBLE else View.GONE
                  rowPresets.visibility = vis
                  rowAdjust.visibility = vis

                  val sec = ms / 1000
                  if (sec != lastNotifSecond) {
                      lastNotifSecond = sec
                      nm.notify(ID_RUN, runningNotification(fmt(ms, false)))
                  }
              }

              private fun toggleRun() {
                  stopAlarm()
                  if (running) pause() else start()
              }

              private fun start() {
                  if (finished || (countdown && accumulated >= presetMs)) resetTimer()
                  running = true
                  startedAt = SystemClock.elapsedRealtime()
                  acquireWake()
                  applyStyle()
                  handler.removeCallbacks(tick)
                  handler.post(tick)
                  refreshUi()
              }

              private fun pause() {
                  accumulated = elapsed()
                  running = false
                  handler.removeCallbacks(tick)
                  releaseWake()
                  applyStyle()
                  refreshUi()
              }

              private fun resetTimer() {
                  handler.removeCallbacks(tick)
                  stopAlarm()
                  releaseWake()
                  running = false
                  finished = false
                  accumulated = 0L
                  applyStyle()
                  refreshUi()
              }

              private fun setPreset(min: Int) {
                  presetMs = min * 60_000L
                  resetTimer()
              }

              private fun adjust(deltaSec: Int) {
                  presetMs = (presetMs + deltaSec * 1000L).coerceIn(1_000L, 359_999_000L)
                  if (finished) resetTimer() else if (running) acquireWake()
                  refreshUi()
              }

              private fun onFinish() {
                  accumulated = presetMs
                  running = false
                  finished = true
                  handler.removeCallbacks(tick)
                  releaseWake()
                  applyStyle()
                  refreshUi()
                  if (prefs.getBoolean(Prefs.SOUND_ON, true)) {
                      sound.play(
                          prefs.getString(Prefs.SOUND_ID, "bell") ?: "bell",
                          prefs.getString(Prefs.SOUND_URI, null)
                      )
                      handler.removeCallbacks(soundStopper)
                      handler.postDelayed(soundStopper, prefs.getInt(Prefs.RING_SECS, 20) * 1000L)
                  }
                  if (prefs.getBoolean(Prefs.VIB_ON, true)) vibrate()
                  notifyDone()
              }

              // ---------- Alarm / vibration / wake lock ----------

              private fun stopAlarm() {
                  handler.removeCallbacks(soundStopper)
                  sound.stop()
                  nm.cancel(ID_DONE)
              }

              @Suppress("DEPRECATION")
              private fun vibrate() {
                  try {
                      val v: Vibrator? = if (Build.VERSION.SDK_INT >= 31) {
                          getSystemService(VibratorManager::class.java)?.defaultVibrator
                      } else {
                          getSystemService(Vibrator::class.java)
                      }
                      v?.vibrate(VibrationEffect.createWaveform(longArrayOf(0, 500, 300, 500, 300, 500), -1))
                  } catch (e: Exception) {
                  }
              }

              /** Keeps the CPU awake so the alarm rings on time even with the screen off. */
              private fun acquireWake() {
                  releaseWake()
                  val pm = getSystemService(PowerManager::class.java)
                  val timeout = if (countdown) {
                      (presetMs - elapsed()).coerceAtLeast(1_000L) + 5_000L
                  } else {
                      6 * 60 * 60 * 1000L
                  }
                  wakeLock = pm.newWakeLock(PowerManager.PARTIAL_WAKE_LOCK, "FloatingTimer:run").apply {
                      setReferenceCounted(false)
                      acquire(timeout)
                  }
              }

              private fun releaseWake() {
                  try {
                      wakeLock?.let { if (it.isHeld) it.release() }
                  } catch (e: Exception) {
                  }
                  wakeLock = null
              }
          }
          EOF_FILE

