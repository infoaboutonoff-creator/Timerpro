              private fun themeName(): String = when (prefs.getInt(Prefs.THEME, 0)) {
                  1 -> "Day"
                  2 -> "Night"
                  else -> "Auto"
              }

              // ---------- time fields ----------

              private fun readSeconds(): Int {
                  val h = tH.text.toString().toIntOrNull() ?: 0
                  val m = tM.text.toString().toIntOrNull() ?: 0
                  val s = tS.text.toString().toIntOrNull() ?: 0
                  return (h * 3600 + m * 60 + s).coerceIn(1, 359999)
              }

              private fun showSeconds(total: Int) {
                  tH.setText(String.format(Locale.US, "%02d", total / 3600))
                  tM.setText(String.format(Locale.US, "%02d", (total % 3600) / 60))
                  tS.setText(String.format(Locale.US, "%02d", total % 60))
              }

              private fun saveTime() {
                  val t = readSeconds()
                  prefs.edit().putInt(Prefs.TOTAL_SECS, t).apply()
                  showSeconds(t)
